[project]
name = "codex-router-jev-adapter"
version = "0.1.0"
description = "Private process adapter for bounded Codex Router recommendations."
requires-python = ">=3.13,<3.14"
dependencies = [
  "typesafe-sdk==0.7.2",
]

[project.scripts]
codex-router-jev = "jev_adapter.worker:main"

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py313"
